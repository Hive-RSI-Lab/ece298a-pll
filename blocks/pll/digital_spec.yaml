# digital_spec.yaml - the digital side's declared copy of the crossing
# signals in interface.yaml, field for field. The digital side is the tile
# top itself; the analog block is a hard macro inside it.
top: ihsan_sa_pll
interface:
  - name: vco_div2
    direction: a2d
    level: cmos_3v3
    domain: clk_free
    width: 1
    load: "prescaler first toggle flop clock (one async-reset flop CLK); VCO/2 from the macro's TSPC divider, full swing, ~50% duty, held at a fixed level while pll_en=0, up to 185 MHz (half the VCO's 370 MHz ceiling)"
  - name: pfd_up
    direction: d2a
    level: cmos_3v3
    domain: clk_ref
    width: 1
    load: "charge pump UP switch input, active high sources Icp into the loop filter"
  - name: pfd_dn
    direction: d2a
    level: cmos_3v3
    domain: clk_fb
    width: 1
    load: "charge pump DN switch input, active high sinks Icp from the loop filter"
  - name: pll_en
    direction: d2a
    level: cmos_3v3
    domain: clk_ref
    width: 1
    load: "pump, bias and VCO power-down, active high enables, quasi-static"
  - name: cp_trim0
    direction: d2a
    level: cmos_3v3
    domain: clk_ref
    width: 1
    load: "charge pump current trim bit 0 (mirror ratio select), quasi-static"
  - name: cp_trim1
    direction: d2a
    level: cmos_3v3
    domain: clk_ref
    width: 1
    load: "charge pump current trim bit 1 (mirror ratio select), quasi-static"
